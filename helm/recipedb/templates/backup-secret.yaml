{{- /*
SSH material for the nightly backup CronJob (roadmap item 3).

Kept OUT of templates/secret.yaml on purpose: that Secret is checksummed into
the Deployment pod template, so rotating a backup key must not restart the app
(and the app pod must never see this Secret at all -- see the guard in
app/lib/backup-seam.test.ts). Only the backup CronJob mounts it, at /secrets.

The values come from the out-of-repo secrets values file
(~/.config/recipedb/k8s-secrets.yaml, mode 0600) exactly like
secrets.FAMILY_PASSWORD_HASH -- see helm/recipedb/secrets.example.yaml.
`required` fails the render instead of arming a CronJob that cannot log in.
*/ -}}
{{- if .Values.backup.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "recipedb.fullname" . }}-backup-ssh
  labels:
    {{- include "recipedb.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
type: Opaque
stringData:
  id_ed25519: {{ required "backup.sshKey is required when backup.enabled=true (see helm/recipedb/secrets.example.yaml)" .Values.backup.sshKey | quote }}
  known_hosts: {{ required "backup.knownHosts is required when backup.enabled=true (see helm/recipedb/secrets.example.yaml)" .Values.backup.knownHosts | quote }}
{{- end }}
