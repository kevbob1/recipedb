apiVersion: v1
kind: Secret
metadata:
  name: {{ include "recipedb.fullname" . }}
  labels:
    {{- include "recipedb.labels" . | nindent 4 }}
type: Opaque
data:
  # `required` fails the render instead of deploying a pod that cannot
  # authenticate anyone (assertAuthEnvConfigured would crash it anyway).
  FAMILY_PASSWORD_HASH: {{ required "secrets.FAMILY_PASSWORD_HASH is required (see helm/recipedb/secrets.example.yaml)" .Values.secrets.FAMILY_PASSWORD_HASH | b64enc | quote }}
  SESSION_SECRET: {{ required "secrets.SESSION_SECRET is required (see helm/recipedb/secrets.example.yaml)" .Values.secrets.SESSION_SECRET | b64enc | quote }}
