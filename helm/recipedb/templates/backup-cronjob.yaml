{{- /*
Nightly disaster-recovery backup (roadmap item 3).

Gated on backup.enabled: the default is `false` so a release keeps deploying
before the ssh key material has been put in the (out-of-repo) secrets values
file. When it is on, templates/backup-secret.yaml fails the render unless both
backup.sshKey and backup.knownHosts are non-empty -- a CronJob that cannot
authenticate would just fail every night, silently.

There is ONE image: this job runs the Deployment image (same repository/tag/
pullPolicy/imagePullSecrets). The runtime stage of the Dockerfile carries
openssh-client + rsync + backup-k8s.sh, so app and backup always ship together.

The pod co-mounts the app's RWO PVC read-only (local-path is node-local, so it
schedules next to the app; a second read-only mount is safe) and mounts the
rendered ssh Secret at /secrets. The DB copy itself goes through
better-sqlite3's online backup API, which is consistent under live WAL writes --
no scale-down, no quiescing.
*/ -}}
{{- if .Values.backup.enabled }}
{{- $fullname := include "recipedb.fullname" . }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $fullname }}-backup
  labels:
    {{- include "recipedb.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  # Never overlap two backups on the same PVC; a stuck rsync must not stack.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ .Values.backup.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.backup.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.backup.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: {{ .Values.backup.ttlSecondsAfterFinished }}
      template:
        metadata:
          labels:
            {{- include "recipedb.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: backup
          annotations:
            # The ssh key lives in this chart's own backup Secret now, so a key
            # rotation should roll the next pod template rather than nothing.
            checksum/backup-secret: {{ include (print $.Template.BasePath "/backup-secret.yaml") . | sha256sum }}
        spec:
          restartPolicy: Never
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: backup
              # Same image as the Deployment, by construction: the runtime
              # stage has the ssh tooling, so there is no separate backup tag.
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              # backup-k8s.sh is bash (set -euo pipefail, arrays); bookworm-slim
              # ships /bin/bash.
              command: ["/bin/bash", "/app/backup-k8s.sh"]
              env:
                - name: DATA_DIR
                  value: {{ .Values.env.DATA_DIR | default "/data" | quote }}
                - name: WORKDIR
                  value: "/tmp/backup"
                - name: BACKUP_HOST
                  value: {{ .Values.backup.host | quote }}
                - name: BACKUP_USER
                  value: {{ .Values.backup.sshUser | quote }}
                - name: BACKUP_PATH
                  value: {{ .Values.backup.path | quote }}
                - name: RETENTION_DAYS
                  value: {{ .Values.backup.retentionDays | quote }}
                # ssh must not try to create $HOME/.ssh in a read-only image dir.
                - name: HOME
                  value: "/tmp"
                - name: BACKUP_SSH_KEY
                  value: "/secrets/id_ed25519"
                - name: BACKUP_KNOWN_HOSTS
                  value: "/secrets/known_hosts"
              volumeMounts:
                # READ-ONLY: the backup pod must never be able to write the
                # volume the single-writer app owns.
                - name: data
                  mountPath: {{ .Values.env.DATA_DIR | default "/data" }}
                  readOnly: true
                - name: ssh
                  mountPath: /secrets
                  readOnly: true
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: {{ include "recipedb.dataVolume" . }}
                readOnly: true
            - name: ssh
              secret:
                secretName: {{ $fullname }}-backup-ssh
                defaultMode: 0440
                items:
                  - key: id_ed25519
                    path: id_ed25519
                  - key: known_hosts
                    path: known_hosts
{{- end }}
