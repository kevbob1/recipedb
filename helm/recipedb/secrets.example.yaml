# Copy to a location OUTSIDE the repo (e.g. ~/.config/recipedb/k8s-secrets.yaml,
# mode 0600) and fill in the real values. Never commit this file.
#
#   helm upgrade --install recipedb ./helm/recipedb \
#     -f ~/.config/recipedb/k8s-secrets.yaml \
#     --set image.repository=registry.k.pd.o/recipedb --set image.tag=<timestamp>
#
# recipedb predates the SOPS/`helm secrets` convention used by the other
# charts in this cluster (there is no .sops.yaml here), so these values come
# from a plaintext file the operator keeps on the workstation. Note that helm
# stores the rendered values in the release secret either way.
#
# Generate:
#   FAMILY_PASSWORD_HASH: node -e "const {hashSync}=require('@node-rs/argon2');process.stdout.write(hashSync('the family password'))"
#                         (must be an argon2id PHC string -- the server rejects others)
#   SESSION_SECRET:       openssl rand -base64 48
secrets:
  FAMILY_PASSWORD_HASH: ""
  SESSION_SECRET: ""

# ---------------------------------------------------------------------------
# Nightly backup CronJob (roadmap item 3) -- opt-in, off by default.
#
# The ssh key material goes HERE (this 0600 out-of-repo file), not into a
# kubectl-created Secret: helm renders it into <release>-backup-ssh, mounted
# only by the backup pod at /secrets. Both values are required at render time
# once enabled=true. See README, "Backups (k8s)".
#
#   ssh-keygen -t ed25519 -N '' -C recipedb-backup \
#     -f ~/.config/recipedb/backup-id_ed25519      # on prox6, authorized there
#   ssh-keyscan -t ed25519 prox6                   # paste the output below
#
# backup:
#   enabled: true
#   sshKey: |
#     -----BEGIN OPENSSH PRIVATE KEY-----
#     <base64 line 1>
#     <base64 line 2>
#     -----END OPENSSH PRIVATE KEY-----
#   knownHosts: |
#     prox6 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI... (placeholder)
#   # host: prox6
#   # sshUser: root
#   # path: /srv/recipedb/backups
#   # retentionDays: 14
#   # schedule: "17 6 * * *"
#
# Nothing else is needed: the job runs the same image as the Deployment, so
# there is no separate backup image to build or push.
