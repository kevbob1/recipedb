# Copy to a location OUTSIDE the repo (e.g. ~/.config/recipedb/k8s-secrets.yaml,
# mode 0600) and fill in the real values. Never commit this file.
#
#   helm upgrade --install recipedb ./helm/recipedb \
#     -f ~/.config/recipedb/k8s-secrets.yaml \
#     --set image.repository=registry.k.pd.o/recipedb --set image.tag=<timestamp>
#
# recipedb predates the SOPS/`helm secrets` convention used by the other
# charts in this cluster (there is no .sops.yaml here), so these values come
# from a plaintext file the operator keeps on the workstation. Note that helm
# stores the rendered values in the release secret either way.
#
# Generate:
#   FAMILY_PASSWORD_HASH: node -e "const {hashSync}=require('@node-rs/argon2');process.stdout.write(hashSync('the family password'))"
#                         (must be an argon2id PHC string -- the server rejects others)
#   SESSION_SECRET:       openssl rand -base64 48
secrets:
  FAMILY_PASSWORD_HASH: ""
  SESSION_SECRET: ""
